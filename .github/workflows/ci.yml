name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: python -m pytest -m "not parity"

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: >-
          python -m pytest -m "not parity"
          --cov=petls_pytorch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && !cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Check formatting
        if: matrix.python-version == '3.13'
        run: python -m ruff format --check .

      - name: Run lint
        if: matrix.python-version == '3.13'
        run: python -m ruff check .

      - name: Run mypy
        run: python -m mypy src/petls_pytorch benchmark

  parity:
    name: PETLS parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and reference PETLS
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" petls==1.0.1

      - name: Run parity tests
        run: python -m pytest -m parity
