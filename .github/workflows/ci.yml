name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --extra dev

      - name: Run tests
        if: matrix.python-version != '3.13'
        run: uv run --frozen python -m pytest -m "not parity"

      - name: Run tests with coverage
        if: matrix.python-version == '3.13'
        run: >-
          uv run --frozen python -m pytest -m "not parity"
          --cov=petls_pytorch
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80

      - name: Upload coverage report
        if: matrix.python-version == '3.13' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python-3.13
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Check formatting
        if: matrix.python-version == '3.13'
        run: uv run --frozen ruff format --check .

      - name: Run lint
        if: matrix.python-version == '3.13'
        run: uv run --frozen ruff check .

      - name: Run mypy
        run: uv run --frozen mypy src/petls_pytorch benchmark

  parity:
    name: PETLS parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install package and reference PETLS
        env:
          UV_PYTHON: "3.13"
          UV_PYTHON_DOWNLOADS: never
        run: uv sync --frozen --extra dev --extra parity

      - name: Run parity tests
        run: uv run --frozen python -m pytest -m parity
